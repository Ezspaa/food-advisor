<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in — Food Advisor</title>
  <meta name="description" content="Log in to Food Advisor to write reviews, save favourites or manage your restaurant.">
  <link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/style.css">
  <script src="/js/theme.js"></script>
</head>
<body>
  <header id="site-header" class="site-header"></header>

  <main id="main" class="auth">
    <div class="auth-visual">
      <img src="https://images.unsplash.com/photo-1414235077428-338989a2e8c0?auto=format&amp;fit=crop&amp;w=1400&amp;q=70" alt="">
      <blockquote><p>“Good food is the foundation of genuine happiness.”</p><footer>— Auguste Escoffier</footer></blockquote>
    </div>
    <div class="auth-form">
      <div class="box">
        <h1>Welcome back</h1>
        <p class="sub">Log in to review restaurants, save favourites and manage your account.</p>
        <div id="formAlert"></div>
        <form id="loginForm" novalidate>
          <div class="field">
            <label for="email">Email <span class="req">*</span></label>
            <div class="input-icon"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg><input class="input" type="email" id="email" name="email" required maxlength="120" autocomplete="email" placeholder="you@example.com"></div>
          </div>
          <div class="field">
            <label for="password">Password <span class="req">*</span></label>
            <div class="input-icon"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg><input class="input" type="password" id="password" name="password" required maxlength="72" autocomplete="current-password" placeholder="Your password"><button type="button" class="btn btn-ghost btn-icon btn-sm toggle-pass" aria-label="Show password"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button></div>
          </div>
          <div style="display:flex;justify-content:space-between;align-items:center;margin:-4px 0 20px">
            <label class="check"><input type="checkbox" id="remember" name="remember"> Remember my email</label>
          </div>
          <button class="btn btn-primary btn-lg btn-block" type="submit">Log in</button>
        </form>
        <p class="switch-link">New to Food Advisor? <a href="/register" id="toRegister">Create an account</a></p>
        <div class="demo-accounts">
          <h5>Demo accounts · password <code>Password123</code></h5>
          <div class="row">
            <button type="button" data-demo="customer@foodadvisor.kz"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>Customer</button>
            <button type="button" data-demo="owner@foodadvisor.kz"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 14v6h10v-6M6.5 14A4.5 4.5 0 0 1 7.6 5.2 5 5 0 0 1 16.4 5.2 4.5 4.5 0 0 1 17.5 14z"/></svg>Owner</button>
            <button type="button" data-demo="admin@foodadvisor.kz"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3 4.5 6v6c0 4.5 3.2 8 7.5 9 4.3-1 7.5-4.5 7.5-9V6z"/><path d="m9 12 2 2 4-4"/></svg>Admin</button>
          </div>
        </div>
      </div>
    </div>
  </main>


  <script src="/js/vendor/jquery-3.7.1.min.js"></script>
  <script src="/js/core.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
